<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快888快捷导航</title>
    <style>
              /* 宁源模式下的背景和挽联（不变） */
        body.ningyuan-mode {
            background: #333333;
        }
        body.ningyuan-mode::before,
        body.ningyuan-mode::after {
            content: "";
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            font-family: "楷体", "华文楷书", "KaiTi", serif;
            font-size: 24px;
            color: white;
            background: transparent;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            white-space: nowrap;
            z-index: 5000;
            pointer-events: none;
            letter-spacing: 8px;
            text-shadow: 0 0 6px rgba(0,0,0,0.5);
        }
        body.ningyuan-mode::before {
            right: 10px;
            content: "死生有命";
        }
        body.ningyuan-mode::after {
            left: 10px;
            content: "富贵在天";
        }
        @media (max-width: 768px) {
            body.ningyuan-mode::before,
            body.ningyuan-mode::after {
                font-size: 16px;
                letter-spacing: 4px;
            }
        }

        /* 需要变灰的主要内容区域（不包含固定浮动层） */
        .ningyuan-grayscale {
            filter: grayscale(1);
        }
        /* 天气栏在宁源模式下强制红色（不受灰度影响） */
        body.ningyuan-mode .weather-info {
            filter: grayscale(0);
            color: #ff0000 !important;
            background: #000000 !important;
            border-color: #ff0000 !important;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); /* 默认蓝色背景 */
            min-height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
       
        /* 顶部导航栏 */
        .navbar {
            background: linear-gradient(to bottom, #f5f5f5, #e8e8e8);

            font-weight: bold;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .navbar-search {

            gap: 4px;
            align-items: center;
        }

        .search-select {

            border-radius: 3px;
            font-size: 0.9em;
            background: white;
            color: #333;
            cursor: pointer;

            flex-shrink: 0;
        }

        .search-input {

            padding: 7px 10px;
            border: 1px solid #999;
            border-radius: 3px;
            font-size: 0.9em;
            background: white;
            color: #333;

        .navbar-right {

        /* 主容器 */

    <script>
        // ========== 单用户注册/登录模态框（淡蓝 + 彩蛋 + 宁源特殊登录）==========
        (function() {
            // 全局状态
            let currentUser = null;            // 当前登录的用户名
            const ADMIN_USERNAME = '宁源';     // 内置特殊用户名
            const ADMIN_PASSWORD = '20180417'; // 内置特殊密码

            // 注入样式
            const modalStyle = document.createElement('style');
            modalStyle.textContent = `
                .arg-overlay {

                .forgot-link {

            document.head.appendChild(modalStyle);
            
           // 宁源账号样式（只保留天气栏红色样式，灰度由 .ningyuan-grayscale 控制）
            const themeStyle = document.createElement('style');
            themeStyle.textContent = `
                body.ningyuan-mode .weather-info {
                    filter: grayscale(0);
                    color: #ff0000 !important;
                    background: #000000 !important;
                    border-color: #ff0000 !important;
                }
            `;
            document.head.appendChild(themeStyle);

            // 音频相关
            let audioCtx = null;
            function playWarningSound() {
                try {
                    if (!audioCtx) {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                    const currentTime = audioCtx.currentTime;
                    // 声音1: 低音
                    const osc1 = audioCtx.createOscillator();
                    const gain1 = audioCtx.createGain();
                    osc1.connect(gain1);
                    gain1.connect(audioCtx.destination);
                    osc1.type = 'sawtooth';
                    osc1.frequency.value = 440;
                    gain1.gain.value = 0;
                    osc1.start();
                    gain1.gain.linearRampToValueAtTime(0.3, currentTime + 0.02);
                    gain1.gain.exponentialRampToValueAtTime(0.0001, currentTime + 0.2);
                    osc1.stop(currentTime + 0.2);
                    // 声音2: 高音
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.type = 'square';
                    osc2.frequency.value = 880;
                    gain2.gain.value = 0;
                    osc2.start(currentTime + 0.1);
                    gain2.gain.linearRampToValueAtTime(0.25, currentTime + 0.12);
                    gain2.gain.exponentialRampToValueAtTime(0.0001, currentTime + 0.6);
                    osc2.stop(currentTime + 0.6);
                    // 白噪音
                    const bufferSize = 4096;
                    const noiseNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);
                    noiseNode.onaudioprocess = function(e) {
                        const output = e.outputBuffer.getChannelData(0);
                        for (let i = 0; i < bufferSize; i++) {
                            output[i] = (Math.random() * 2 - 1) * 0.8;
                        }
                    };
                    const noiseGain = audioCtx.createGain();
                    noiseNode.connect(noiseGain);
                    noiseGain.connect(audioCtx.destination);
                    noiseGain.gain.value = 0;
                    noiseGain.gain.linearRampToValueAtTime(0.15, currentTime + 0.05);
                    noiseGain.gain.exponentialRampToValueAtTime(0.0001, currentTime + 0.4);
                    noiseNode.start(currentTime);
                    noiseNode.stop(currentTime + 0.4);
                    setTimeout(() => {
                        try { noiseNode.disconnect(); } catch(e) {}
                    }, 500);
                } catch(e) {
                    console.warn('警告音效播放失败', e);
                }
            }

            // 黑屏 + 乱码特效
            function blackout(durationMs = 1500) {
                let blackDiv = document.querySelector('.arg-blackout');
                if (!blackDiv) {
                    blackDiv = document.createElement('div');
                    blackDiv.className = 'blackout arg-blackout';
                    document.body.appendChild(blackDiv);
                }
                const toast = document.querySelector('.custom-toast');
                if (toast) toast.style.zIndex = '30001';
                blackDiv.classList.add('active');
                setTimeout(() => {
                    blackDiv.classList.remove('active');
                    const bodyElement = document.body;
                    bodyElement.style.transition = 'all 0.1s';
                    bodyElement.style.filter = 'blur(2px)';
                    let counter = 0;
                    const interval = setInterval(() => {
                        if (counter >= 3) {
                            clearInterval(interval);
                            bodyElement.style.filter = '';
                            bodyElement.style.transition = '';
                            if (toast && toast.parentNode) toast.remove();
                            return;
                        }
                        if (counter % 2 === 0) {
                            bodyElement.style.filter = 'blur(3px) grayscale(1)';
                            bodyElement.style.opacity = '0.95';
                        } else {
                            bodyElement.style.filter = '';
                            bodyElement.style.opacity = '';
                        }
                        counter++;
                    }, 150);
                }, durationMs);
            }

            function showWarning(message, duration = 3000) {
                const toast = document.createElement('div');
                toast.className = 'custom-toast';
                toast.textContent = message;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), duration);
            }

            // 存储逻辑
            const STORAGE_KEY = 'arg_single_user';
            function getStoredUser() {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    try { return JSON.parse(raw); } catch(e) { return null; }
                }
                return null;
            }
            function saveUser(username, password) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ username, password }));
            }
            function clearUser() {
                localStorage.removeItem(STORAGE_KEY);
            }
            
 // 应用宁源主题（灰色背景 + 挽联 + 主要内容灰度）
   function applyNingyuanTheme() {
    document.body.classList.add('ningyuan-mode');
    const grayscaleTargets = document.querySelectorAll('.navbar, .container, .virtual-footer-section, .real-footer');
    grayscaleTargets.forEach(el => el.classList.add('ningyuan-grayscale'));
    const weatherDiv = document.querySelector('.weather-info');
    if (weatherDiv) {
        weatherDiv.textContent = '📍 ？？？ -8层';
        // 删除内联样式，完全依赖 CSS 类
        weatherDiv.style.color = '';
        weatherDiv.style.backgroundColor = '';
    }
}
 // 回复正常主题
function restoreDefaultTheme() {
    document.body.classList.remove('ningyuan-mode');
    const grayscaleTargets = document.querySelectorAll('.navbar, .container, .virtual-footer-section, .real-footer');
    grayscaleTargets.forEach(el => el.classList.remove('ningyuan-grayscale'));
    const weatherDiv = document.querySelector('.weather-info');
    if (weatherDiv) {
        weatherDiv.textContent = '📍 北淀市 -18℃ 雨';
        weatherDiv.style.color = '';
        weatherDiv.style.backgroundColor = '';
    }
}
            
            // 增强红色闪烁效果（全屏红色遮罩 + 强烈闪烁）
    function redFlash() {
        // 创建临时红色遮罩层
        const flashOverlay = document.createElement('div');
        flashOverlay.style.position = 'fixed';
        flashOverlay.style.top = '0';
        flashOverlay.style.left = '0';
        flashOverlay.style.width = '100%';
        flashOverlay.style.height = '100%';
        flashOverlay.style.backgroundColor = 'rgba(255, 0, 0, 0.8)';
        flashOverlay.style.zIndex = '99999';
        flashOverlay.style.pointerEvents = 'none';
        flashOverlay.style.transition = 'opacity 0.2s';
        flashOverlay.style.opacity = '1';
        document.body.appendChild(flashOverlay);
        
        // 0.2秒后淡出并移除
        setTimeout(() => {
            flashOverlay.style.opacity = '0';
            setTimeout(() => {
                flashOverlay.remove();
            }, 200);     // 淡出用时 0.2秒
        }, 200);      // 保持完全红色 0.2秒
    }
            // 更新顶部导航栏
            function updateNavButtons() {
                const navRight = document.querySelector('.navbar-right');
                if (!navRight) return;
                if (currentUser) {
                    navRight.innerHTML = `
                        <div class="user-menu-container" style="position: relative;">
                            <button class="user-menu-btn" style="padding: 7px 16px; background: #0066cc; color: white; border: none; border-radius: 3px; cursor: pointer;">👤 ${currentUser}</button>
                            <div class="user-dropdown" style="display: none; position: absolute; right: 0; top: 100%; background: white; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 2000; min-width: 100px;">
                                <button class="dropdown-logout" style="display: block; width: 100%; padding: 8px 12px; border: none; background: none; text-align: left; cursor: pointer;">🚪 登出</button>
                                <button class="dropdown-delete" style="display: block; width: 100%; padding: 8px 12px; border: none; background: none; text-align: left; cursor: pointer; color: #d32f2f;">🗑️ 注销账号</button>
                            </div>
                        </div>
                    `;
                    const menuBtn = navRight.querySelector('.user-menu-btn');
                    const dropdown = navRight.querySelector('.user-dropdown');
                    menuBtn.onclick = (e) => {
                        e.stopPropagation();
                        dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
                    };
                    document.addEventListener('click', function closeDropdown(e) {
                        if (!navRight.contains(e.target)) dropdown.style.display = 'none';
                    });
                    navRight.querySelector('.dropdown-logout').onclick = () => {
                        if (confirm('确定要登出吗？')) logout();
                    };
                    navRight.querySelector('.dropdown-delete').onclick = () => {
                        if (confirm(`确定要注销账号「${currentUser}」吗？\n（只删除账号，浏览记录及更改仍保留）`)) deleteAccount();
                    };
                } else {
                    navRight.innerHTML = `<button class="login-btn">登陆</button><button class="register-btn">注册</button>`;
                    const loginBtn = navRight.querySelector('.login-btn');
                    const registerBtn = navRight.querySelector('.register-btn');
                    if (loginBtn) loginBtn.onclick = () => window.handleLogin();
                    if (registerBtn) registerBtn.onclick = () => window.handleRegister();
                }
            }

            function logout() {
        // 如果当前登录的是宁源，先恢复主题
        if (currentUser === ADMIN_USERNAME) {
            restoreDefaultTheme();
        }
        currentUser = null;
        updateNavButtons();
        alert('已安全登出');
    }

// 显示大量红色"再见"占满屏幕，每隔几个字播放一次警告音，全部出现后红色闪烁    
function showRedGoodbye(callback) {        
    const container = document.createElement('div');        
    container.style.position = 'fixed';        
    container.style.top = '0';        
    container.style.left = '0';        
    container.style.width = '100%';        
    container.style.height = '100%';        
    container.style.zIndex = '40000';        
    container.style.pointerEvents = 'none';        
    container.style.overflow = 'hidden';        
    document.body.appendChild(container);                
    const wordCount = 200;        
    const words = [];        
    for (let i = 0; i < wordCount; i++) {            
        const span = document.createElement('span');            
        span.textContent = '再见';            
        span.style.position = 'absolute';            
        span.style.color = '#ff0000';            
        const fontSize = Math.floor(Math.random() * 80 + 20);            
        span.style.fontSize = fontSize + 'px';            
        span.style.fontWeight = 'bold';            
        span.style.fontFamily = 'monospace';            
        span.style.whiteSpace = 'nowrap';            
        span.style.opacity = '0';            
        span.style.transition = 'opacity 0.05s linear';            
        span.style.left = Math.random() * 100 + '%';            
        span.style.top = Math.random() * 100 + '%';            
        span.style.transform = `rotate(${Math.random() * 30 - 15}deg)`;            
        container.appendChild(span);            
        words.push(span);        
    }                
    const delays = words.map(() => Math.random() * 1000);        
    let completedCount = 0;  
    
    const soundInterval = 25;   // 每25个字播放一次警告音
    const soundOffset = 0;
    
    words.forEach((word, idx) => {            
        setTimeout(() => {                
            word.style.opacity = '1';                
            if ((idx - soundOffset) % soundInterval === 0) {
                playWarningSound();                
            }
            completedCount++;                
            if (completedCount === wordCount) {                    
                redFlash();                
            }            
        }, delays[idx]);        
    });                
    setTimeout(() => {            
        words.forEach(word => {                
            word.style.transition = 'opacity 0.3s';
            word.style.opacity = '0';
        });
        setTimeout(() => {
            container.remove();
            if (callback) callback();   // 特效全部结束后执行回调
        }, 400);
    }, 1200);
}
            
            function deleteAccount() {
                const isAdmin = (currentUser === ADMIN_USERNAME);
              if (isAdmin) {
                    playWarningSound();
                    showWarning('没关系，下次再见~', 1800);   // 红色警告框，持续1.8秒
                    
                    // 第一步：在警告框消失的同时（1.8秒后）恢复彩色界面
                    setTimeout(() => {
                        restoreDefaultTheme();   // 移除灰度滤镜、恢复天气栏、移除挽联
                    }, 1800);
                    
                    // 第二步：再延迟1秒（即总延迟2.8秒）开始显示红色“再见”特效
                    setTimeout(() => {
                        showRedGoodbye(() => {
                            // 第三步：特效全部结束后才真正登出（清空用户、更新导航栏）
                            currentUser = null;
                            updateNavButtons();
                        });
                    }, 2800);
                    
                    return;
                }
                const stored = getStoredUser();
                if (stored && stored.username === currentUser) {
                    clearUser();
                    alert(`账号「${currentUser}」已注销，账号已清除。\n感谢您的使用！`);
                }
                currentUser = null;
                updateNavButtons();
            }

            function forgotPassword() {
                const user = getStoredUser();
                if (!user) {
                    alert('❌ 尚无注册账号，请先注册。');
                    return;
                }
                const code = prompt('🔐 密码找回验证\n请输入内推码：');
                if (code === null) return;
                if (code === 'womenjiehunba') {
                    alert(`当前账号「${user.username}」的密码是：${user.password}\n请妥善保管。`);
                } else {
                    alert('❌ 内推码错误，无法获取密码。');
                }
            }

            let currentModal = null;
            function closeModal() {
                if (currentModal) {
                    currentModal.classList.remove('active');
                    setTimeout(() => {
                        if (currentModal && currentModal.parentNode) currentModal.remove();
                        currentModal = null;
                    }, 200);
                }
            }

            function showRegisterModal() {
                closeModal();
                const overlay = document.createElement('div');
                overlay.className = 'arg-overlay';
                overlay.innerHTML = `
                    <div class="arg-modal">
                        <span class="arg-close">&times;</span>
                        <h3>📝 注册</h3>
                        <div class="arg-group"><label>用户名</label><input type="text" id="reg_user" placeholder="请输入用户名"></div>
                        <div class="arg-group"><label>密码</label><input type="password" id="reg_pwd" placeholder="设置密码"></div>
                        <div class="arg-group"><label>确认密码</label><input type="password" id="reg_confirm" placeholder="再次输入密码"></div>
                        <div class="arg-group"><label>内推码</label><input type="text" id="reg_invite" placeholder="请输入内推码"></div>
                        <div class="arg-buttons"><button class="arg-btn-primary" id="reg_submit">注册</button><button class="arg-btn-secondary" id="reg_cancel">取消</button></div>
                    </div>
                `;
                document.body.appendChild(overlay);
                currentModal = overlay;

                overlay.querySelector('.arg-close').onclick = closeModal;
                overlay.querySelector('#reg_cancel').onclick = closeModal;
                overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };

                const submitBtn = overlay.querySelector('#reg_submit');
                submitBtn.onclick = () => {
                    try {
                        const username = overlay.querySelector('#reg_user').value.trim();
                        const password = overlay.querySelector('#reg_pwd').value;
                        const confirm = overlay.querySelector('#reg_confirm').value;
                        const invite = overlay.querySelector('#reg_invite').value.trim();

                        if (!username) { alert('❌ 用户名不能为空'); return; }
                        if (!password) { alert('❌ 密码不能为空'); return; }
                        if (!confirm) { alert('❌ 请确认密码'); return; }
                        if (!invite) { alert('❌ 内推码不能为空'); return; }
                        if (username === '宁源') {
                            playWarningSound();
                            showWarning('⚠️ 该用户名已被占用 ⚠️', 1800);
                            blackout(2000);
                            overlay.querySelector('#reg_user').value = '';
                            overlay.querySelector('#reg_pwd').value = '';
                            overlay.querySelector('#reg_confirm').value = '';
                            overlay.querySelector('#reg_invite').value = '';
                            return;
                        }
                        if (password !== confirm) { alert('⚠️ 两次输入的密码不一致'); return; }
                        if (invite !== 'womenjiehunba') { alert('❌ 内推码错误'); return; }

                        const existing = getStoredUser();
                        if (existing) {
                            if (!window.confirm(`⚠️ 已有账号「${existing.username}」。\n注册新账号将清除旧数据，是否继续？`)) return;
                            clearUser();
                        }
                        saveUser(username, password);
                        alert(`✨ 注册成功！\n欢迎「${username}」，请登录。`);
                        closeModal();
                    } catch (err) {
                        alert('注册出错：' + err.message);
                        console.error(err);
                    }
                };
                overlay.classList.add('active');
            }

            function showLoginModal() {
                closeModal();
                const overlay = document.createElement('div');
                overlay.className = 'arg-overlay';
                overlay.innerHTML = `
                    <div class="arg-modal">
                        <span class="arg-close">&times;</span>
                        <h3>🔐 登录</h3>
                        <div class="arg-group"><label>用户名</label><input type="text" id="login_user" placeholder="你的注册名"></div>
                        <div class="arg-group"><label>密码</label><input type="password" id="login_pwd" placeholder="密码"></div>
                        <div class="forgot-link"><a id="forgot_btn">忘记密码？</a></div>
                        <div class="arg-buttons"><button class="arg-btn-primary" id="login_submit">登陆</button><button class="arg-btn-secondary" id="login_cancel">取消</button></div>
                    </div>
                `;
                document.body.appendChild(overlay);
                currentModal = overlay;

                overlay.querySelector('.arg-close').onclick = closeModal;
                overlay.querySelector('#login_cancel').onclick = closeModal;
                overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
                overlay.querySelector('#forgot_btn').onclick = (e) => { e.preventDefault(); forgotPassword(); };

                const loginBtn = overlay.querySelector('#login_submit');
                loginBtn.onclick = () => {
                    const username = overlay.querySelector('#login_user').value.trim();
                    const password = overlay.querySelector('#login_pwd').value;
                    if (!username || !password) {
                        alert('❌ 用户名和密码都不能为空');
                        return;
                    }
                    let loginSuccess = false;
                    // 先检查是否为宁源
                  if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                        loginSuccess = true;
                        currentUser = ADMIN_USERNAME;
                        applyNingyuanTheme();   // 先应用主题
                        redFlash();             // 再闪烁（内部会临时移除灰度再恢复）
                    } else {
                        // 普通用户验证
                        const stored = getStoredUser();
                        if (stored && stored.username === username && stored.password === password) {
                            loginSuccess = true;
                            currentUser = username;
                        }
                    }
                    if (loginSuccess) {
                        alert(`✅ 登陆成功！欢迎回来，${username}`);
                        closeModal();
                        updateNavButtons();
                    } else {
                        alert('❌ 用户名或密码错误');
                    }
                };
                overlay.classList.add('active');
            }

            // 暴露全局函数
            window.handleLogin = showLoginModal;
            window.handleRegister = showRegisterModal;

            // 页面加载完成后初始化导航栏按钮状态
            window.addEventListener('DOMContentLoaded', function() {
                updateNavButtons();
            });
        })();

        // 显示登录提示（保持原有）
        function showLoginPrompt(event) {
            event.preventDefault();
            alert('🔒 请登录后查看');
        }

        // 搜索功能处理
        document.querySelector('.search-btn').addEventListener('click', function() {
            const searchType = document.getElementById('searchType').value;
            const searchText = document.querySelector('.search-input').value;
            if (searchText.trim()) {
                const typeLabel = searchType === 'search' ? '搜索' : '地道搜索';
                alert(`🔍 ${typeLabel}：${searchText}\n\n搜索功能开发中...`);
            } else {
                alert('请输入搜索内容');
            }
        });

        // 回车搜索
        document.querySelector('.search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('.search-btn').click();
            }
        });
    </script>
