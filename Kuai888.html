    <style>
        
/* 图片预览模态框（独立于登录模态框） */
.img-preview-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    z-index: 15000;      /* 低于警告框20000、黑屏30000等 */
    display: flex;
    align-items: center;
    justify-content: center;
    visibility: hidden;
    opacity: 0;
    transition: visibility 0.2s, opacity 0.2s;
}
.img-preview-overlay.active {
    visibility: visible;
    opacity: 1;
}
.img-preview-container {
    position: relative;
    max-width: 90%;
    max-height: 90%;
}
.img-preview-img {
    max-width: 100%;
    max-height: 90vh;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.img-preview-close {
    position: absolute;
    top: -40px;
    right: 0;
    font-size: 36px;
    color: white;
    cursor: pointer;
    background: rgba(0,0,0,0.5);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
}
.img-preview-close:hover {
    background: rgba(255,0,0,0.7);
    transform: scale(1.1);
}
@media (max-width: 550px) {
    .img-preview-close {
        top: -30px;
        width: 30px;
        height: 30px;
        font-size: 24px;
    }
}
      /* 左右弹性布局容器（已存在，若已定义则无需重复） */
.external-push-wrapper {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    max-width: 1200px;
    margin: 0px auto 20px auto;
    width: 100%;
    box-sizing: border-box;
}
.external-push-item {
    flex: 1;
    min-width: 200px;
}

/* 左侧大图样式 */
.external-push-img {
    width: 100%;
    height: auto;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    transition: transform 0.2s;
    cursor: pointer;
}
.external-push-img:hover {
    transform: scale(1.01);
}

/* 右侧卡片样式 */
.card-link-wrapper {
    position: relative;
    display: block;
    text-decoration: none;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    transition: transform 0.2s;
}
.card-link-wrapper:hover {
    transform: scale(1.01);
}
.card-img {
    width: 100%;
    height: 75%;
    object-fit: cover;
    display: block;
}
.card-text-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0, 0, 0, 0.6); /* 半透明黑色背景 */
    color: white;
    text-align: center;
    padding: 12px;
    font-size: 1.2rem;
    font-weight: bold;
    backdrop-filter: blur(4px); /* 可选毛玻璃效果 */
}
.card-title {
    font-size: 1.1rem;
    font-weight: bold;
    margin-bottom: 4px;
}
.card-desc {
    font-size: 0.85rem;
    opacity: 0.9;
}

  /* 窗口四：问答卡片样式（只保留一份） */
.quiz-card {
    background: rgba(20, 20, 30, 0.85);
    backdrop-filter: blur(8px);
    border-radius: 12px;
    padding: 16px 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    transition: transform 0.2s;
}
.quiz-card:hover {
    transform: scale(1.01);
}
.quiz-question {
    font-size: 1rem;
    font-weight: bold;
    color: #ffd966;
    text-align: center;
    margin-bottom: 12px;
}
.quiz-options {
    display: flex;
    flex-direction: row;          /* 横向排列 */
    justify-content: space-around;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}
.quiz-options label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    color: white;
    cursor: pointer;
}
.quiz-options input[type="radio"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
}
.quiz-feedback {
    text-align: center;
    font-size: 0.85rem;
    font-weight: bold;
    min-height: 32px;
    padding: 4px;
    border-radius: 20px;
}
.quiz-feedback.correct {
    color: #a0ffa0;
    background: rgba(0,100,0,0.3);
}
.quiz-feedback.wrong {
    color: #ffa0a0;
    background: rgba(100,0,0,0.3);
}

/* 让第三列内部上下排列 */
.column-third {
    display: flex;
    flex-direction: column;
    gap: 20px;
}
        
/* 配对卡片样式（确保高度正常） */
.pair-card {
    display: flex;
    align-items: flex-end;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    background-size: cover;
    background-position: center;
    min-height: 260px;        /* 保证卡片有足够高度，与背景图片比例协调 */
    height: auto;
    transition: transform 0.2s;
    text-decoration: none;
    cursor: pointer;
}
.pair-card:hover {
    transform: scale(1.01);  /* 悬停放大，与图2一致 */
}
        
.pair-card-content {
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(4px);
    width: 100%;
    padding: 20px 16px;
    text-align: center;
    color: white;
}
.external-push-wrapper.two-columns {
    display: grid;
    grid-template-columns: 2fr 1fr;  /* 宽度比例 */
    gap: 20px;
    align-items: stretch;            /* 高度拉伸对齐 */
}
.two-columns .left-column,
.two-columns .right-column {
    display: flex;
    flex-direction: column;
    gap: 20px;
    height: 100%;                    /* 重要：让 flex 容器填满网格单元格 */
}

/* 响应式：小屏幕恢复垂直排列 */
@media (max-width: 768px) {
    .external-push-wrapper.two-columns {
        display: flex;
        flex-direction: column;
    }
}
}
  
    </style>

<!-- 外推图片区域：两列等高布局 -->

    <script>
        
// 问答卡片交互逻辑
(function() {
    const quizRadios = document.querySelectorAll('input[name="answer"]');
    const feedbackDiv = document.querySelector('.quiz-feedback');
    if (quizRadios.length && feedbackDiv) {
        function checkAnswer() {
            let selectedValue = null;
            for (let radio of quizRadios) {
                if (radio.checked) {
                    selectedValue = radio.value;
                    break;
                }
            }
            if (!selectedValue) {
                feedbackDiv.textContent = '';
                feedbackDiv.className = 'quiz-feedback';
                return;
            }
            if (selectedValue === '2018') {
               feedbackDiv.innerHTML = '✓ 正确！<b style="color: red;">password1</b>。';
                feedbackDiv.classList.remove('wrong');
                feedbackDiv.classList.add('correct');
            } else {
                feedbackDiv.textContent = '✗ 错误。';
                feedbackDiv.classList.remove('correct');
                feedbackDiv.classList.add('wrong');
            }
        }
        quizRadios.forEach(radio => {
            radio.addEventListener('change', checkAnswer);
        });
    }
})();

        // 图片预览功能（独立于登录注册系统）
(function() {
   // 创建预览浮层
const previewOverlay = document.createElement('div');
previewOverlay.className = 'img-preview-overlay';
previewOverlay.innerHTML = `
    <div class="img-preview-container">
        <span class="img-preview-close">&times;</span>
        <img class="img-preview-img" src="" alt="预览图">
    </div>
`;
    document.body.appendChild(previewOverlay);
    // 如果当前是宁源模式，给预览浮层添加灰度类（通过统一接口）
if (window.NingyuanTheme && typeof window.NingyuanTheme.applyGrayScaleIfNeeded === 'function') {
    window.NingyuanTheme.applyGrayScaleIfNeeded(previewOverlay);
} else {
    if (document.body.classList.contains('ningyuan-mode')) {
        previewOverlay.classList.add('ningyuan-grayscale');
    }
}
    
    const closeBtn = previewOverlay.querySelector('.img-preview-close');
    const previewImg = previewOverlay.querySelector('.img-preview-img');
    
   function showImagePreview() {
    previewImg.src = 'images/外推2.jpg';   // 直接指定放大图片的路径
    previewOverlay.classList.add('active');
}
    function hideImagePreview() {
    previewOverlay.classList.remove('active');
    // 不要清空 src，保持图片缓存
}
    // 点击关闭按钮或遮罩关闭
    closeBtn.onclick = hideImagePreview;
    previewOverlay.onclick = (e) => {
        if (e.target === previewOverlay) hideImagePreview();
    };
    // 绑定点击图片事件（确保图片加载后再绑定）
   const pushImg = document.getElementById('external-push-img');
if (pushImg) {
    pushImg.onclick = () => {
        showImagePreview();   // 无需传参
    };
}
})();
        
        // 显示登录提示（保持原有）
        function showLoginPrompt(event) {
            event.preventDefault();
            alert('🔒 请登录后查看');
        }
        
    </script>
