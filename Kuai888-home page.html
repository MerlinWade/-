<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="preload" as="image" href="images/外推2.jpg">
    <link rel="preload" as="image" href="images/警惕诈骗.jpg">
    <link rel="preload" as="image" href="images/20180417.jpg">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快888快捷导航</title>
    
    <!-- ========== 1. CSS 样式（先加载） ========== -->
    <link rel="stylesheet" href="css/Kuai888-common.css">
    <link rel="stylesheet" href="css/NingYuan-mode.css">
    
    <!-- ========== 页面特有样式（原封不动保留） ========== -->
    <style>
        /* ---------- 外推图片区域 ---------- */
        .external-push-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            margin: 0px auto 20px auto;
            width: 100%;
            box-sizing: border-box;
        }
        .external-push-item {
            flex: 1;
            min-width: 200px;
        }

        /* 左侧大图 */
        .external-push-img {
            width: 100%;
            height: auto;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .external-push-img:hover {
            transform: scale(1.01);
        }

        /* 防诈骗卡片 */
        .card-link-wrapper {
            position: relative;
            display: block;
            text-decoration: none;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }
        .card-link-wrapper:hover {
            transform: scale(1.01);
        }
        .card-img {
            width: 100%;
            height: auto;
            object-fit: cover;
            display: block;
        }
        .card-text-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            color: white;
            text-align: center;
            padding: 12px;
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .card-desc {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* 问答卡片 */
        .quiz-card {
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 16px 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .quiz-card:hover {
            transform: scale(1.01);
        }
        .quiz-question {
            font-size: 1rem;
            font-weight: bold;
            color: #ffd966;
            text-align: center;
            margin-bottom: 12px;
        }
        .quiz-options {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .quiz-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
        }
        .quiz-options input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .quiz-feedback {
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            min-height: 32px;
            padding: 4px;
            border-radius: 20px;
        }
        .quiz-feedback.correct {
            color: #a0ffa0;
            background: rgba(0,100,0,0.3);
        }
        .quiz-feedback.wrong {
            color: #ffa0a0;
            background: rgba(100,0,0,0.3);
        }

        /* 配对卡片 */
        .pair-card {
            display: flex;
            align-items: flex-end;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            background-size: cover;
            background-position: center;
            min-height: 260px;
            height: auto;
            transition: transform 0.2s;
            text-decoration: none;
            cursor: pointer;
        }
        .pair-card:hover {
            transform: scale(1.01);
        }
        .pair-card-content {
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            width: 100%;
            padding: 20px 16px;
            text-align: center;
            color: white;
        }

        /* 两列等高布局 */
        .external-push-wrapper.two-columns {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            align-items: stretch;
        }
        .two-columns .left-column,
        .two-columns .right-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }

        /* 图片预览模态框 */
        .img-preview-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 15000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
        }
        .img-preview-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .img-preview-container {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }
        .img-preview-img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .img-preview-close {
            position: absolute;
            top: -40px;
            right: 0;
            font-size: 36px;
            color: white;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .img-preview-close:hover {
            background: rgba(255,0,0,0.7);
            transform: scale(1.1);
        }
        @media (max-width: 550px) {
            .img-preview-close {
                top: -30px;
                width: 30px;
                height: 30px;
                font-size: 24px;
            }
        }

        /* 响应式微调 */
        @media (max-width: 768px) {
            .external-push-wrapper.two-columns {
                display: flex;
                flex-direction: column;
            }
            .external-push-img, .card-img {
                max-height: none;
                object-fit: contain;
            }
            .pair-card {
                min-height: 220px;
            }
        }
        @media (max-width: 480px) {
            .pair-card {
                min-height: 180px;
            }
        }
    </style>

    <!-- ========== 2. JavaScript 模块（按依赖顺序加载） ========== -->
    <script src="js/Effects.js"></script>
    <script src="js/Log&Register.js"></script>
    <script src="js/NingYuan-mode.js"></script>
    <script src="js/Search.js"></script>
    <script src="js/Kuai888-component.js"></script>
</head>
<body>
    <!-- ========== 导航栏占位 ========== -->

    <!-- ========== 主内容 ========== -->
    <div class="container">

            <div class="nav-content">

                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">拼夕夕</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">AlieAlie啊咧视频</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">嗨奇异</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">终点文学城</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">造浪新闻</a></div>

                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">地气论坛</a></div>
                    </div>
                    <div class="link-row">
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">脸盆博客</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">2333小游戏</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">帅喵音乐</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">难闲邮箱</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">996全城</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">知忽</a></div>

                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">历史浏览</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== 外推图片区域 ========== -->
    <div class="external-push-wrapper two-columns">
        <!-- 左列 -->
        <div class="external-push-item left-column">
            <a href="#" class="card-link-wrapper" id="card-link-wrapper">
                <div class="card-image">
                    <img id="card-img" src="images/警惕诈骗.jpg" alt="警惕诈骗" class="card-img">
                </div>
                <div class="card-text-overlay">
                    <div class="card-title">近期网络诈骗频发，请留意上当受骗</div>
                    <div class="card-desc">记者了解到，诈骗手段层出不穷，请提高警惕。</div>
                </div>
            </a>
            <div class="quiz-card">
                <div class="quiz-question">脑筋急转弯：不知天上宫阙，今夕是（）年？</div>
                <div class="quiz-options">
                    <label><input type="radio" name="answer" value="0"> 何</label>
                    <label><input type="radio" name="answer" value="2018"> 2018</label>
                    <label><input type="radio" name="answer" value="2026"> 2026</label>
                </div>
                <div class="quiz-feedback"></div>
            </div>
        </div>
        <!-- 右列 -->
        <div class="external-push-item right-column">
            <img id="external-push-img" src="images/外推1.jpg" alt="外推音乐推荐" class="external-push-img">
            <a href="#" class="pair-card" id="pair-card" style="background-image: url('images/配对.jpg'); background-size: cover; background-position: center; text-decoration: none;">
                <div class="pair-card-content">
                    <h3 class="pair-title">姓名配对缘分测试</h3>
                    <p class="pair-desc">输入双方姓名，测测你们之间的缘分吧</p>
                </div>

        </div>
    </div>

    <!-- ========== 页脚占位 ========== -->
    <div id="virtual-footer-placeholder"></div>
    <div id="real-footer-placeholder"></div>

    <!-- ========== 页面特定脚本 ========== -->
    <script>
        // 问答卡片交互
        (function() {
            const quizRadios = document.querySelectorAll('input[name="answer"]');
            const feedbackDiv = document.querySelector('.quiz-feedback');
            if (quizRadios.length && feedbackDiv) {
                function checkAnswer() {
                    let selectedValue = null;
                    for (let radio of quizRadios) {
                        if (radio.checked) {
                            selectedValue = radio.value;
                            break;
                        }
                    }
                    if (!selectedValue) {
                        feedbackDiv.textContent = '';
                        feedbackDiv.className = 'quiz-feedback';
                        return;
                    }
                    if (selectedValue === '2018') {
                        feedbackDiv.innerHTML = '✓ 正确！<b style="color: red;">password1</b>。';
                        feedbackDiv.classList.remove('wrong');
                        feedbackDiv.classList.add('correct');
                    } else {
                        feedbackDiv.textContent = '✗ 错误。';
                        feedbackDiv.classList.remove('correct');
                        feedbackDiv.classList.add('wrong');
                    }
                }
                quizRadios.forEach(radio => {
                    radio.addEventListener('change', checkAnswer);
                });
            }
        })();

        // 图片预览
        (function() {
            const previewOverlay = document.createElement('div');
            previewOverlay.className = 'img-preview-overlay';
            previewOverlay.innerHTML = `
                <div class="img-preview-container">
                    <span class="img-preview-close">&times;</span>
                    <img class="img-preview-img" src="" alt="预览图">
                </div>
            `;
            document.body.appendChild(previewOverlay);
            if (window.NingyuanTheme && typeof window.NingyuanTheme.applyGrayScaleIfNeeded === 'function') {
                window.NingyuanTheme.applyGrayScaleIfNeeded(previewOverlay);
            } else if (document.body.classList.contains('ningyuan-mode')) {
                previewOverlay.classList.add('ningyuan-grayscale');
            }

            const closeBtn = previewOverlay.querySelector('.img-preview-close');
            const previewImg = previewOverlay.querySelector('.img-preview-img');

            function showImagePreview() {
                previewImg.src = 'images/外推2.jpg';
                previewOverlay.classList.add('active');
            }
            function hideImagePreview() {
                previewOverlay.classList.remove('active');
            }
            closeBtn.onclick = hideImagePreview;
            previewOverlay.onclick = (e) => {
                if (e.target === previewOverlay) hideImagePreview();
            };
            const pushImg = document.getElementById('external-push-img');
            if (pushImg) {
                pushImg.onclick = () => showImagePreview();
            }
        })();

        function showLoginPrompt(event) {
            event.preventDefault();
            alert('🔒 请登录后查看');
        }
    </script>
</body>
</html>
