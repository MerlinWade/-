<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快888快捷导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航栏 */
        .navbar {
            background: linear-gradient(to bottom, #f5f5f5, #e8e8e8);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 12px 15px;
            margin-bottom: 25px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .navbar-brand {
            font-size: 1.2em;
            font-weight: bold;
            color: #1e3c72;
            letter-spacing: 1px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .weather-info {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 3px;
            padding: 6px 10px;
            font-size: 0.85em;
            color: #856404;
            font-weight: bold;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .navbar-search {
            flex: 1;
            min-width: 250px;
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .search-select {
            padding: 7px 10px;
            border: 1px solid #999;
            border-radius: 3px;
            font-size: 0.9em;
            background: white;
            color: #333;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            padding: 7px 10px;
            border: 1px solid #999;
            border-radius: 3px;
            font-size: 0.9em;
            background: white;
            color: #333;
            min-width: 120px;
        }

        .search-btn {
            padding: 7px 18px;
            background: linear-gradient(to bottom, #0066cc, #0052a3);
            color: white;
            border: 1px solid #003d82;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            transition: background 0.3s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .search-btn:hover {
            background: linear-gradient(to bottom, #0052a3, #003d82);
        }

        .navbar-right {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        .login-btn {
            padding: 7px 16px;
            background: white;
            color: #0066cc;
            border: 1px solid #0066cc;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s, color 0.3s;
            white-space: nowrap;
        }

        .login-btn:hover {
            background: #0066cc;
            color: white;
        }

        .register-btn {
            padding: 7px 16px;
            background: #ff6600;
            color: white;
            border: 1px solid #ff6600;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s;
            white-space: nowrap;
        }

        .register-btn:hover {
            background: #ff5500;
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }

        /* 导航板块 */
        .nav-section {
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .nav-header {
            background: linear-gradient(to right, #f0f0f0, #e0e0e0);
            border-bottom: 2px solid #0066cc;
            padding: 12px 20px;
            font-size: 1.1em;
            font-weight: bold;
            color: #1e3c72;
            letter-spacing: 1px;
        }

        .nav-content {
            padding: 20px;
        }

        .link-list {
            display: table;
            width: 100%;
            border-collapse: collapse;
        }

        .link-row {
            display: table-row;
        }

        .link-cell {
            display: table-cell;
            padding: 10px;
            text-align: left;
            vertical-align: middle;
        }

        .link-item {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 10px 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: #0066cc;
            display: inline-block;
            font-weight: 500;
            font-size: 0.95em;
        }

        .link-item:hover {
            background: #0066cc;
            color: white;
            border-color: #0066cc;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        }

        /* 虚拟页脚区域 */
        .virtual-footer-section {
            margin-bottom: 25px;
        }

        .virtual-footer {
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .virtual-footer p {
            color: #666;
            font-size: 0.9em;
            line-height: 1.6;
            margin: 8px 0;
        }

        .virtual-footer a {
            color: #0066cc;
            text-decoration: none;
        }

        .virtual-footer a:hover {
            text-decoration: underline;
        }

        /* 历史浏览按钮 */
        .history-btn {
            padding: 10px 20px;
            background: linear-gradient(to bottom, #6c757d, #5a6268);
            color: white;
            border: 1px solid #545b62;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: bold;
            transition: background 0.3s;
            display: block;
            margin: 0 auto 20px;
        }

        .history-btn:hover {
            background: linear-gradient(to bottom, #5a6268, #4e555b);
        }

        /* 真实页脚 */
        .real-footer {
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .real-footer p {
            color: #666;
            font-size: 0.85em;
            margin: 5px 0;
        }

        .real-footer a {
            color: #0066cc;
            text-decoration: none;
        }

        .real-footer a:hover {
            text-decoration: underline;
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .navbar {
                padding: 10px 12px;
                gap: 10px;
            }

            .navbar-brand {
                font-size: 1.1em;
            }

            .navbar-search {
                min-width: 200px;
            }

            .search-input {
                min-width: 100px;
            }

            .weather-info {
                font-size: 0.8em;
                padding: 5px 8px;
            }

            .link-cell {
                padding: 8px;
            }

            .link-item {
                font-size: 0.9em;
                padding: 8px 12px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .navbar {
                flex-direction: column;
                align-items: stretch;
                padding: 10px;
                gap: 8px;
            }

            .navbar-brand {
                text-align: center;
                font-size: 1.1em;
            }

            .weather-info {
                text-align: center;
                width: 100%;
            }

            .navbar-search {
                width: 100%;
                min-width: unset;
            }

            .navbar-right {
                justify-content: center;
                width: 100%;
            }

            .link-list {
                display: block;
            }

            .link-row {
                display: flex;
                flex-wrap: wrap;
                margin-bottom: 10px;
            }

            .link-cell {
                display: flex;
                justify-content: center;
                padding: 5px;
                flex: 1;
                min-width: 120px;
            }

            .link-item {
                width: 100%;
                text-align: center;
                font-size: 0.9em;
            }

            .virtual-footer p {
                font-size: 0.85em;
            }

            .real-footer p {
                font-size: 0.8em;
            }
        }

        @media (max-width: 480px) {
            .navbar-brand {
                font-size: 1em;
                letter-spacing: 0.5px;
            }

            .search-select {
                font-size: 0.85em;
                padding: 6px 8px;
            }

            .search-input {
                font-size: 0.85em;
                padding: 6px 8px;
                min-width: 80px;
            }

            .search-btn {
                font-size: 0.85em;
                padding: 6px 14px;
            }

            .login-btn,
            .register-btn {
                font-size: 0.85em;
                padding: 6px 12px;
            }

            .weather-info {
                font-size: 0.75em;
                padding: 4px 6px;
            }

            .nav-content {
                padding: 15px;
            }

            .link-cell {
                padding: 4px;
                min-width: 100px;
            }

            .link-item {
                font-size: 0.85em;
                padding: 8px 10px;
            }

            .history-btn {
                font-size: 0.9em;
                padding: 8px 16px;
            }

            .virtual-footer p {
                font-size: 0.8em;
            }

            .real-footer p {
                font-size: 0.75em;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="navbar">
        <div class="navbar-brand">🌐 快888快捷导航</div>
        <div class="weather-info">📍 北淀市 -18℃ 雨</div>
        <div class="navbar-search">
            <select class="search-select" id="searchType">
                <option value="search">搜索</option>
                <option value="daodelao">地道搜索</option>
            </select>
            <input type="text" class="search-input" placeholder="搜索网站、新闻、资讯...">
            <button class="search-btn">搜索</button>
        </div>
        <div class="navbar-right">
            <button class="login-btn" onclick="handleLogin()">登陆</button>
            <button class="register-btn" onclick="handleRegister()">注册</button>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="container">
        <!-- 个人常用网址导航 -->
        <div class="nav-section">
            <div class="nav-header">⭐ 个人常用网址导航</div>
            <div class="nav-content">
                <div class="link-list">
                    <div class="link-row">
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">淘沙网</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">拼夕夕</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">AlieAlie啊咧视频</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">嗨奇异</a></div>
                    </div>
                    <div class="link-row">
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">终点文学城</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">造浪新闻</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">啾啾空间</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">地气论坛</a></div>
                    </div>
                    <div class="link-row">
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">脸盆博客</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">2333小游戏</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">帅喵音乐</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">难闲邮箱</a></div>
                    </div>
                    <div class="link-row">
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">996全城</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">知忽</a></div>
                        <div class="link-cell"><a href="#" class="link-item" onclick="showLoginPrompt(event)">缘缘婚恋网</a></div>
                        <div class="link-cell"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 历史浏览按钮 -->
    <button class="history-btn" onclick="handleHistory()">📜 历史浏览</button>

    <!-- 虚拟页脚区域 -->
    <div class="virtual-footer-section">
        <!-- 虚拟页脚 -->
        <div class="virtual-footer">
            <p>© 2018-2026 快888快捷导航 | <a href="#">关于我们</a> | <a href="#">联系方式</a> | <a href="#">用户协议</a></p>| <a href="#">广告服务</a></p>
        </div>

    <!-- 真实页脚 -->
    <div class="real-footer">
        <p>本网站的内容为虚构游戏作品，与任何真实的人物、团体或事件无关。</p>
        <p>© 2026 MerlinWade. All rights reserved. | 本作品受著作权保护。未经许可，不得以任何形式转载或复制。</p>
    </div>

    <script>
        // 登陆按钮处理
        function handleLogin() {
            alert('🔐 登陆功能开发中...\n敬请期待！');
        }

        // 注册按钮处理
        function handleRegister() {
            alert('📝 注册功能开发中...\n敬请期待！');
        }

        // 显示登陆提示
        function showLoginPrompt(event) {
            event.preventDefault();
            alert('🔒 请登录后查看');
        }

        // 历史浏览按钮处理
        function handleHistory() {
            alert('📜 历史浏览功能开发中...\n将用于储存你打开过的网页信息');
        }

        // 搜索功能处理
        document.querySelector('.search-btn').addEventListener('click', function() {
            const searchType = document.getElementById('searchType').value;
            const searchText = document.querySelector('.search-input').value;
            if (searchText.trim()) {
                const typeLabel = searchType === 'search' ? '搜索' : '地道搜索';
                alert(`🔍 ${typeLabel}：${searchText}\n\n搜索功能开发中...`);
            } else {
                alert('请输入搜索内容');
            }
        });

        // 回车搜索
        document.querySelector('.search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('.search-btn').click();
            }
        });
    </script>
</body>
</html>
