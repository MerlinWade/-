<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络导航中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航栏 */
        .navbar {
            background: linear-gradient(to bottom, #f5f5f5, #e8e8e8);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 15px 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .navbar-brand {
            font-size: 1.3em;
            font-weight: bold;
            color: #1e3c72;
            letter-spacing: 2px;
        }

        .weather-info {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 3px;
            padding: 5px 12px;
            font-size: 0.9em;
            color: #856404;
            font-weight: bold;
        }

        .navbar-search {
            flex: 1;
            min-width: 300px;
            display: flex;
            gap: 5px;
        }

        .search-select {
            padding: 8px 12px;
            border: 1px solid #999;
            border-radius: 3px;
            font-size: 0.95em;
            background: white;
            color: #333;
            cursor: pointer;
        }

        .search-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #999;
            border-radius: 3px;
            font-size: 0.95em;
            background: white;
            color: #333;
        }

        .search-btn {
            padding: 8px 20px;
            background: linear-gradient(to bottom, #0066cc, #0052a3);
            color: white;
            border: 1px solid #003d82;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: bold;
            transition: background 0.3s;
        }

        .search-btn:hover {
            background: linear-gradient(to bottom, #0052a3, #003d82);
        }

        .navbar-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .login-btn {
            padding: 8px 20px;
            background: white;
            color: #0066cc;
            border: 1px solid #0066cc;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background 0.3s, color 0.3s;
        }

        .login-btn:hover {
            background: #0066cc;
            color: white;
        }

        .register-btn {
            padding: 8px 20px;
            background: #ff6600;
            color: white;
            border: 1px solid #ff6600;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background 0.3s;
        }

        .register-btn:hover {
            background: #ff5500;
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            flex: 1;
        }

        /* 导航板块 */
        .nav-section {
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .nav-header {
            background: linear-gradient(to right, #f0f0f0, #e0e0e0);
            border-bottom: 2px solid #0066cc;
            padding: 12px 20px;
            font-size: 1.1em;
            font-weight: bold;
            color: #1e3c72;
            letter-spacing: 1px;
        }

        .nav-content {
            padding: 20px;
        }

        .link-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .link-item {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 10px 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: #0066cc;
            display: inline-block;
            font-weight: 500;
        }

        .link-item:hover {
            background: #0066cc;
            color: white;
            border-color: #0066cc;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        }

        /* 页脚 */
        .footer-container {
            margin-top: auto;
        }

        .footer-disclaimer {
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .disclaimer-title {
            font-weight: bold;
            color: #1e3c72;
            margin-bottom: 10px;
            font-size: 1em;
        }

        .disclaimer-text {
            color: #666;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .copyright {
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .copyright p {
            color: #666;
            font-size: 0.85em;
            margin: 5px 0;
        }

        .copyright a {
            color: #0066cc;
            text-decoration: none;
        }

        .copyright a:hover {
            text-decoration: underline;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: stretch;
            }

            .navbar-search {
                min-width: 100%;
            }

            .link-list {
                flex-direction: column;
                gap: 10px;
            }

            .link-item {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="navbar">
        <div class="navbar-brand">🌐 网络导航中心</div>
        <div class="weather-info">📍 北淀市 -18℃ 雨</div>
        <div class="navbar-search">
            <select class="search-select" id="searchType">
                <option value="search">搜索</option>
                <option value="daodelao">地道搜索</option>
            </select>
            <input type="text" class="search-input" placeholder="搜索网站、新闻、资讯...">
            <button class="search-btn">搜索</button>
        </div>
        <div class="navbar-right">
            <button class="login-btn" onclick="handleLogin()">登陆</button>
            <button class="register-btn" onclick="handleRegister()">注册</button>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="container">
        <!-- 个人常用网址导航 -->
        <div class="nav-section">
            <div class="nav-header">⭐ 个人常用网址导航</div>
            <div class="nav-content">
                <div class="link-list">
                    <a href="#" class="link-item" onclick="showLoginPrompt(event)">淘沙网</a>
                    <a href="#" class="link-item" onclick="showLoginPrompt(event)">拼夕夕</a>
                    <a href="#" class="link-item" onclick="showLoginPrompt(event)">AlieAlie啊咧视频</a>
                    <a href="#" class="link-item" onclick="showLoginPrompt(event)">嗨奇异</a>
                    <a href="#" class="link-item" onclick="showLoginPrompt(event)">终点文学城</a>
                    <a href="#" class="link-item" onclick="showLoginPrompt(event)">造浪新闻</a>
                    <a href="#" class="link-item" onclick="showLoginPrompt(event)">啾啾空间</a>
                    <a href="#" class="link-item" onclick="showLoginPrompt(event)">地气论坛</a>
                    <a href="#" class="link-item" onclick="showLoginPrompt(event)">脸盆博客</a>
                    <a href="#" class="link-item" onclick="showLoginPrompt(event)">2333小游戏</a>
                    <a href="#" class="link-item" onclick="showLoginPrompt(event)">帅喵音乐</a>
                    <a href="#" class="link-item" onclick="showLoginPrompt(event)">难闲邮箱</a>
                    <a href="#" class="link-item" onclick="showLoginPrompt(event)">996全城</a>
                    <a href="#" class="link-item" onclick="showLoginPrompt(event)">知忽</a>
                    <a href="#" class="link-item" onclick="showLoginPrompt(event)">缘缘婚恋网</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <div class="footer-container">
        <!-- 免责声明 -->
        <div class="footer-disclaimer">
            <div class="disclaimer-title">⚠️ 免责声明</div>
            <div class="disclaimer-text">
                本网站的内容为虚构游戏作品，与任何真实的人物、团体或事件无关。
            </div>
        </div>

        <!-- 著作权信息 -->
        <div class="copyright">
            <p>© 2026 MerlinWade. All rights reserved.</p>
            <p>本作品受著作权保护。未经许可，不得以任何形式转载或复制。</p>
        </div>
    </div>

    <script>
        // 登陆按钮处理
        function handleLogin() {
            alert('🔐 登陆功能开发中...\n敬请期待！');
        }

        // 注册按钮处理
        function handleRegister() {
            alert('📝 注册功能开发中...\n敬请期待！');
        }

        // 显示登陆提示
        function showLoginPrompt(event) {
            event.preventDefault();
            alert('🔒 请登录后查看');
        }

        // 搜索功能处理
        document.querySelector('.search-btn').addEventListener('click', function() {
            const searchType = document.getElementById('searchType').value;
            const searchText = document.querySelector('.search-input').value;
            if (searchText.trim()) {
                const typeLabel = searchType === 'search' ? '搜索' : '地道搜索';
                alert(`🔍 ${typeLabel}：${searchText}\n\n搜索功能开发中...`);
            } else {
                alert('请输入搜索内容');
            }
        });

        // 回车搜索
        document.querySelector('.search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('.search-btn').click();
            }
        });
    </script>
</body>
</html>
