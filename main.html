// 全局音频上下文，避免重复创建和浏览器限制
let audioCtx = null;

function playWarningSound() {
    try {
        // 1. 初始化或恢复音频上下文
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const currentTime = audioCtx.currentTime;
        
        // --- 2. 制造“嗡鸣”感：两个短促的警报音调 ---
        // 声音 1: 低音“呜”
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.type = 'sawtooth';   // 'sawtooth' 比 'sine' 更刺耳可以将 'sawtooth' 换成 'square' 或 'triangle'，音色感觉会完全不同。
        osc1.frequency.value = 440; 
        gain1.gain.value = 0;      
        osc1.start();
        // 快速淡入淡出
        gain1.gain.linearRampToValueAtTime(0.3, currentTime + 0.02);
        gain1.gain.exponentialRampToValueAtTime(0.0001, currentTime + 0.2);
        osc1.stop(currentTime + 0.2);
        
        // 声音 2: 高音“嘀”（延时0.1秒后出现）
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.type = 'square';        
        osc2.frequency.value = 880; 
        gain2.gain.value = 0;
        osc2.start(currentTime + 0.1);
        gain2.gain.linearRampToValueAtTime(0.25, currentTime + 0.12);
        gain2.gain.exponentialRampToValueAtTime(0.0001, currentTime + 0.6);
        osc2.stop(currentTime + 0.6);

        // --- 3. 效果增强：加入一段渐变白噪音“嘶嘶”声 ---
        const bufferSize = 4096;
        const noiseNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);
        noiseNode.onaudioprocess = function(e) {
            const output = e.outputBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = (Math.random() * 2 - 1) * 0.6; // 控制噪音音量
            }
        };
        const noiseGain = audioCtx.createGain();
        noiseNode.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        noiseGain.gain.value = 0;
        noiseGain.gain.linearRampToValueAtTime(0.15, currentTime + 0.05);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, currentTime + 0.4);
        noiseNode.start(currentTime);
        noiseNode.stop(currentTime + 0.4);
        // 清理处理器
        setTimeout(() => {
            try { noiseNode.disconnect(); } catch(e) {}
        }, 500);
    } catch(e) {
        console.warn('警告音效播放失败', e);
    }
}

// 黑屏函数：现在会显示红色警告框，并在消除时产生乱码效果
function blackout(durationMs = 1500) {
    let blackDiv = document.querySelector('.arg-blackout');
    if (!blackDiv) {
        blackDiv = document.createElement('div');
        blackDiv.className = 'blackout arg-blackout';
        document.body.appendChild(blackDiv);
    }
    
    // 1. 首先确保红色警告框在黑屏之上
    const toast = document.querySelector('.custom-toast');
    if (toast) {
        toast.style.zIndex = '30001'; // 比黑屏的30000高1
    }
    
    // 2. 显示黑屏
    blackDiv.classList.add('active');
    
    // 3. 设置定时器准备消除黑屏
    setTimeout(() => {
        // 4. 先移除黑屏，但保留红色警告框
        blackDiv.classList.remove('active');
        
        // 5. 启动“乱码恢复”特效
        const bodyElement = document.body;
        const originalHTML = bodyElement.innerHTML;
        // 模拟乱码场景 (仅一次性视觉特效)
        bodyElement.style.transition = 'all 0.1s';
        bodyElement.style.filter = 'blur(2px)';
        // 生成乱码效果
        let counter = 0;
        const interval = setInterval(() => {
            if (counter >= 3) { // 闪烁3次后恢复
                clearInterval(interval);
                bodyElement.style.filter = '';
                bodyElement.style.transition = '';
                // 最后移除红色警告框
                if (toast && toast.parentNode) toast.remove();
                return;
            }
            // 交替应用乱码风格
            if (counter % 2 === 0) {
                bodyElement.style.filter = 'blur(3px) grayscale(1)';
                bodyElement.style.opacity = '0.95';
            } else {
                bodyElement.style.filter = '';
                bodyElement.style.opacity = '';
            }
            counter++;
        }, 150);
    }, durationMs);
}

    // 显示警告提示框（自动消失）

    // 存储逻辑

    function getStoredUser() {

            try { return JSON.parse(raw); } catch(e) { return null; }
        }
        return null;
    }
    function saveUser(username, password) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ username, password }));
    }
    function clearUser() {
        localStorage.removeItem(STORAGE_KEY);
    }

    // 忘记密码（内推码验证后显示密码）
    function forgotPassword() {
        const user = getStoredUser();
        if (!user) {
            alert('❌ 尚无注册账号，请先注册。');
            return;
        }
        const code = prompt('🔐 密码找回验证\n请输入内推码：');
        if (code === null) return;
        if (code === 'womenjiehunba') {
            alert(`📝 当前账号「${user.username}」的密码是：${user.password}\n请妥善保管。`);
        } else {
            alert('❌ 内推码错误，无法获取密码。');
        }
    }

    // 模态框管理
    let currentModal = null;
    function closeModal() {
        if (currentModal) {
            currentModal.classList.remove('active');
            setTimeout(() => {
                if (currentModal && currentModal.parentNode) currentModal.remove();
                currentModal = null;
            }, 200);
        }
    }

    // 注册模态框
    function showRegisterModal() {
        closeModal();
        const overlay = document.createElement('div');
        overlay.className = 'arg-overlay';
        overlay.innerHTML = `
            <div class="arg-modal">
                <span class="arg-close">&times;</span>
                <h3>📝 注册</h3>
                <div class="arg-group">
                    <label>用户名</label>
                    <input type="text" id="reg_user" placeholder="请输入用户名">
                </div>
                <div class="arg-group">
                    <label>密码</label>
                    <input type="password" id="reg_pwd" placeholder="设置密码">
                </div>
                <div class="arg-group">
                    <label>确认密码</label>
                    <input type="password" id="reg_confirm" placeholder="再次输入密码">
                </div>
                <div class="arg-group">
                    <label>内推码</label>
                    <input type="text" id="reg_invite" placeholder="请输入内推码">
                </div>
                <div class="arg-buttons">
                    <button class="arg-btn-primary" id="reg_submit">注册</button>
                    <button class="arg-btn-secondary" id="reg_cancel">取消</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        currentModal = overlay;

        // 关闭事件绑定
        overlay.querySelector('.arg-close').onclick = closeModal;
        overlay.querySelector('#reg_cancel').onclick = closeModal;
        overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };

        const submitBtn = overlay.querySelector('#reg_submit');
        submitBtn.onclick = () => {
            try {
                const username = overlay.querySelector('#reg_user').value.trim();
                const password = overlay.querySelector('#reg_pwd').value;
                const confirm = overlay.querySelector('#reg_confirm').value;
                const invite = overlay.querySelector('#reg_invite').value.trim();

                if (!username) { alert('❌ 用户名不能为空'); return; }
                if (!password) { alert('❌ 密码不能为空'); return; }
                if (!confirm) { alert('❌ 请确认密码'); return; }
                if (!invite) { alert('❌ 内推码不能为空'); return; }

                // 彩蛋：用户名为“宁源”
                if (username === '宁源') {
                    playWarningSound();                     // 播放警告音
                    showWarning('⚠️ 该用户名已被占用 ⚠️', 1800); // 红色提示框
                    blackout(2000);                         // 黑屏1秒
                    // 清空所有输入框
                    overlay.querySelector('#reg_user').value = '';
                    overlay.querySelector('#reg_pwd').value = '';
                    overlay.querySelector('#reg_confirm').value = '';
                    overlay.querySelector('#reg_invite').value = '';
                    return;
                }

                if (password !== confirm) { alert('⚠️ 两次输入的密码不一致'); return; }
                if (invite !== 'womenjiehunba') { alert('❌ 内推码错误'); return; }

                const existing = getStoredUser();
                if (existing) {
                    const userConfirmed = window.confirm(`⚠️ 已有账号「${existing.username}」。\n注册新账号将清除旧数据，是否继续？`);
                    if (!userConfirmed) {
                        return;
                    }
                    clearUser();
                }
                saveUser(username, password);
                alert(`✨ 注册成功！\n欢迎「${username}」，请登录。`);
                closeModal();
            } catch (err) {
                alert('注册出错：' + err.message);
                console.error(err);
            }
        };
        overlay.classList.add('active');
    }

    // 登录模态框
    function showLoginModal() {
        closeModal();
        const overlay = document.createElement('div');
        overlay.className = 'arg-overlay';
        overlay.innerHTML = `
            <div class="arg-modal">
                <span class="arg-close">&times;</span>
                <h3>🔐 登录</h3>
                <div class="arg-group">
                    <label>用户名</label>
                    <input type="text" id="login_user" placeholder="你的注册名">
                </div>
                <div class="arg-group">
                    <label>密码</label>
                    <input type="password" id="login_pwd" placeholder="密码">
                </div>
                <div class="forgot-link"><a id="forgot_btn">忘记密码？</a></div>
                <div class="arg-buttons">
                    <button class="arg-btn-primary" id="login_submit">登陆</button>
                    <button class="arg-btn-secondary" id="login_cancel">取消</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        currentModal = overlay;

        overlay.querySelector('.arg-close').onclick = closeModal;
        overlay.querySelector('#login_cancel').onclick = closeModal;
        overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
        overlay.querySelector('#forgot_btn').onclick = (e) => {
            e.preventDefault();
            forgotPassword();
        };

        const loginBtn = overlay.querySelector('#login_submit');
        loginBtn.onclick = () => {
            const username = overlay.querySelector('#login_user').value.trim();
            const password = overlay.querySelector('#login_pwd').value;
            if (!username || !password) {
                alert('❌ 用户名和密码都不能为空');
                return;
            }
            const stored = getStoredUser();
            if (!stored) {
                alert('❌ 尚未注册，请先注册。');
                return;
            }
            if (stored.username === username && stored.password === password) {
                alert(`✅ 登陆成功！欢迎回来，${username}`);
                closeModal();
            } else {
                alert('❌ 用户名或密码错误');
            }
        };
        overlay.classList.add('active');
    }

    // 全局暴露
    window.handleLogin = showLoginModal;
    window.handleRegister = showRegisterModal;
})();
        
    // 显示登陆提示
    function showLoginPrompt(event) {
        event.preventDefault();
        alert('🔒 请登录后查看');
    }

    // 搜索功能处理
    document.querySelector('.search-btn').addEventListener('click', function() {
        const searchType = document.getElementById('searchType').value;
        const searchText = document.querySelector('.search-input').value;
        if (searchText.trim()) {
            const typeLabel = searchType === 'search' ? '搜索' : '地道搜索';
            alert(`🔍 ${typeLabel}：${searchText}\n\n搜索功能开发中...`);
        } else {
            alert('请输入搜索内容');
        }
    });

    // 回车搜索
    document.querySelector('.search-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.querySelector('.search-btn').click();
        }
    });
</script>
        
</body>
</html>
