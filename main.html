<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快888快捷导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航栏 */
        .navbar {
            background: linear-gradient(to bottom, #f5f5f5, #e8e8e8);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 12px 15px;
            margin-bottom: 25px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .navbar-brand {
            font-size: 1.2em;
            font-weight: bold;
            color: #1e3c72;
            letter-spacing: 1px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .weather-info {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 3px;
            padding: 6px 10px;
            font-size: 0.85em;
            color: #856404;
            font-weight: bold;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .navbar-search {
            flex: 1;
            min-width: 250px;
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .search-select {
            padding: 7px 10px;
            border: 1px solid #999;
            border-radius: 3px;
            font-size: 0.9em;
            background: white;
            color: #333;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            padding: 7px 10px;
            border: 1px solid #999;
            border-radius: 3px;
            font-size: 0.9em;
            background: white;
            color: #333;
            min-width: 120px;
        }

        .search-btn {
            padding: 7px 18px;
            background: linear-gradient(to bottom, #0066cc, #0052a3);
            color: white;
            border: 1px solid #003d82;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            transition: background 0.3s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .search-btn:hover {
            background: linear-gradient(to bottom, #0052a3, #003d82);
        }

        .navbar-right {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        .login-btn {
            padding: 7px 16px;
            background: white;
            color: #0066cc;
            border: 1px solid #0066cc;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s, color 0.3s;
            white-space: nowrap;
        }

        .login-btn:hover {
            background: #0066cc;
            color: white;
        }

        .register-btn {
            padding: 7px 16px;
            background: #ff6600;
            color: white;
            border: 1px solid #ff6600;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s;
            white-space: nowrap;
        }

        .register-btn:hover {
            background: #ff5500;
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }

        /* 导航板块 */
        .nav-section {
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .nav-header {
            background: linear-gradient(to right, #f0f0f0, #e0e0e0);
            border-bottom: 2px solid #0066cc;
            padding: 12px 20px;
            font-size: 1.1em;
            font-weight: bold;
            color: #1e3c72;
            letter-spacing: 1px;
        }

        .nav-content {
            padding: 20px;
        }

        .link-list {
            display: table;
            width: 100%;
            border-collapse: collapse;
        }

        .link-row {
            display: table-row;
        }

        .link-cell {
            display: table-cell;
            padding: 10px;
            text-align: left;
            vertical-align: middle;
        }

        .link-item {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 10px 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: #0066cc;
            display: inline-block;
            font-weight: 500;
            font-size: 0.95em;
        }

        .link-item:hover {
            background: #0066cc;
            color: white;
            border-color: #0066cc;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        }

        /* 虚拟页脚区域 */
        .virtual-footer-section {
            margin-bottom: 25px;
        }

        .virtual-footer {
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .virtual-footer p {
            color: #666;
            font-size: 0.9em;
            line-height: 1.6;
            margin: 8px 0;
        }

        .virtual-footer a {
            color: #0066cc;
            text-decoration: none;
        }

        .virtual-footer a:hover {
            text-decoration: underline;
        }

        /* 历史浏览按钮 */
        .history-btn {
            padding: 10px 20px;
            background: linear-gradient(to bottom, #6c757d, #5a6268);
            color: white;
            border: 1px solid #545b62;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: bold;
            transition: background 0.3s;
            display: block;
            margin: 0 auto 20px;
        }

        .history-btn:hover {
            background: linear-gradient(to bottom, #5a6268, #4e555b);
        }

        /* 真实页脚 */
        .real-footer {
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .real-footer p {
            color: #666;
            font-size: 0.85em;
            margin: 5px 0;
        }

        .real-footer a {
            color: #0066cc;
            text-decoration: none;
        }

        .real-footer a:hover {
            text-decoration: underline;
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .navbar {
                padding: 10px 12px;
                gap: 10px;
            }

            .navbar-brand {
                font-size: 1.1em;
            }

            .navbar-search {
                min-width: 200px;
            }

            .search-input {
                min-width: 100px;
            }

            .weather-info {
                font-size: 0.8em;
                padding: 5px 8px;
            }

            .link-cell {
                padding: 8px;
            }

            .link-item {
                font-size: 0.9em;
                padding: 8px 12px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .navbar {
                flex-direction: column;
                align-items: stretch;
                padding: 10px;
                gap: 8px;
            }

            .navbar-brand {
                text-align: center;
                font-size: 1.1em;
            }

            .weather-info {
                text-align: center;
                width: 100%;
            }

            .navbar-search {
                width: 100%;
                min-width: unset;
            }

            .navbar-right {
                justify-content: center;
                width: 100%;
            }

            .link-list {
                display: block;
            }

            .link-row {
                display: flex;
                flex-wrap: wrap;
                margin-bottom: 10px;
            }

            .link-cell {
                display: flex;
                justify-content: center;
                padding: 5px;
                flex: 1;
                min-width: 120px;
            }

            .link-item {
                width: 100%;
                text-align: center;
                font-size: 0.9em;
            }

            .virtual-footer p {
                font-size: 0.85em;
            }

            .real-footer p {
                font-size: 0.8em;
            }
        }

        @media (max-width: 480px) {
            .navbar-brand {
                font-size: 1em;
                letter-spacing: 0.5px;
            }

            .search-select {
                font-size: 0.85em;
                padding: 6px 8px;
            }

            .search-input {
                font-size: 0.85em;
                padding: 6px 8px;
                min-width: 80px;
            }

            .search-btn {
                font-size: 0.85em;
                padding: 6px 14px;
            }

            .login-btn,
            .register-btn {
                font-size: 0.85em;
                padding: 6px 12px;
            }

            .weather-info {
                font-size: 0.75em;
                padding: 4px 6px;
            }

            .nav-content {
                padding: 15px;
            }

            .link-cell {
                padding: 4px;
                min-width: 100px;
            }

            .link-item {
                font-size: 0.85em;
                padding: 8px 10px;
            }

            .history-btn {
                font-size: 0.9em;
                padding: 8px 16px;
            }

            .virtual-footer p {
                font-size: 0.8em;
            }

            .real-footer p {
                font-size: 0.75em;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="navbar">

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 虚拟页脚区域 -->
    <div class="virtual-footer-section">
        <!-- 虚拟页脚 -->
        <div class="virtual-footer">
            <p>© 2018 快888快捷导航 | <a href="#">关于我们</a> | <a href="#">联系方式</a> | <a href="#">用户协议</a>| <a href="#">广告服务</a></p>
        </div>

    <!-- 真实页脚 -->
    <div class="real-footer">
        <p>本网站的内容为虚构游戏作品，与任何真实的人物、团体或事件无关。</p>
        <p>© 2026 MerlinWade. All rights reserved. | 本作品受著作权保护。未经许可，不得以任何形式转载或复制。</p>

<script>
    
    // ---------- 单用户 ARG 沉浸式注册/登录模块 ----------
    // 仅存储一个用户（localStorage），注册后不可重复注册，体现唯一体验
    (function() {
        // ----- 动态注入模态框样式（适配移动端 + 电脑端）-----
        const modalStyle = document.createElement('style');
        modalStyle.textContent = `
            /* 遮罩层 */
            .arg-modal-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.65);
                backdrop-filter: blur(4px);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000;
                visibility: hidden;
                opacity: 0;
                transition: visibility 0.2s, opacity 0.2s;
            }
            .arg-modal-overlay.active {
                visibility: visible;
                opacity: 1;
            }
            /* 弹窗容器 — 移动端/PC通用 */
            .arg-modal-container {
                background: #ffffff;
                width: 90%;
                max-width: 440px;
                border-radius: 36px;
                box-shadow: 0 30px 40px rgba(0, 0, 0, 0.3);
                padding: 24px 22px 32px;
                transition: transform 0.2s ease;
                transform: scale(0.96);
            }
            .arg-modal-overlay.active .arg-modal-container {
                transform: scale(1);
            }
            .arg-modal-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
                border-bottom: 2px solid #f0eef2;
                padding-bottom: 12px;
            }
            .arg-modal-header h3 {
                font-size: 1.7rem;
                font-weight: 700;
                background: linear-gradient(135deg, #ff8c00, #ff2b4d);
                background-clip: text;
                -webkit-background-clip: text;
                color: transparent;
                margin: 0;
            }
            .arg-close {
                font-size: 32px;
                cursor: pointer;
                line-height: 1;
                color: #aaa;
                transition: 0.2s;
            }
            .arg-close:hover {
                color: #ff2b4d;
            }
            .arg-form-group {
                margin-bottom: 20px;
            }
            .arg-form-group label {
                display: block;
                font-weight: 600;
                margin-bottom: 8px;
                color: #1e293b;
                font-size: 0.9rem;
            }
            .arg-form-group input {
                width: 100%;
                padding: 12px 16px;
                border: 1.5px solid #e2e8f0;
                border-radius: 60px;
                font-size: 1rem;
                outline: none;
                background: #fefefe;
                transition: 0.2s;
                box-sizing: border-box;
            }
            .arg-form-group input:focus {
                border-color: #ff8c00;
                box-shadow: 0 0 0 3px rgba(255,140,0,0.2);
            }
            .arg-buttons {
                display: flex;
                gap: 14px;
                margin-top: 28px;
                flex-wrap: wrap;
            }
            .arg-buttons button {
                flex: 1;
                padding: 12px 0;
                border-radius: 60px;
                font-weight: 700;
                font-size: 1rem;
                cursor: pointer;
                border: none;
                transition: 0.2s;
            }
            .arg-btn-primary {
                background: linear-gradient(135deg, #ff8c00, #ff2b4d);
                color: white;
            }
            .arg-btn-primary:hover {
                transform: translateY(-2px);
                filter: brightness(1.02);
            }
            .arg-btn-secondary {
                background: #f1f5f9;
                color: #334155;
                border: 1px solid #ddd;
            }
            .arg-btn-secondary:hover {
                background: #e6edf4;
            }
            @media (max-width: 550px) {
                .arg-modal-container {
                    padding: 20px 18px 26px;
                }
                .arg-modal-header h3 {
                    font-size: 1.4rem;
                }
                .arg-form-group input {
                    padding: 10px 14px;
                }
            }
        `;
        document.head.appendChild(modalStyle);

   // 忘记密码 -> 通过内推码验证后提示当前密码
        function handleForgotPassword() {
            const storedUser = getStoredUser();
            if (!storedUser) {
                alert('❌ 尚未有任何注册档案，请先注册。');
                return;
            }
            const inputCode = prompt('🔐 密码找回验证\n请输入内推码');
            if (inputCode === null) return;
            // 注意：这里的内推码应与注册时保持一致
            if (inputCode === 'womenjiehunba') { 
                alert(`📝 当前账号「${storedUser.username}」的密码是：${storedUser.password}\n\n请妥善保管，或重新登录。`);
            } else {
                alert('❌ 内推码错误，无法获取密码。');
            }
        }
        
        // ----- 创建模态框DOM（注册 & 登录）-----
        function createModal(type) {
            const overlay = document.createElement('div');
            overlay.className = 'arg-modal-overlay';
            overlay.id = `arg-${type}-modal`;
            
            const container = document.createElement('div');
            container.className = 'arg-modal-container';
            
            const header = document.createElement('div');
            header.className = 'arg-modal-header';
            const title = document.createElement('h3');
            title.textContent = type === 'register' ? '📝 注册' : '🔐 登录';
            const closeSpan = document.createElement('span');
            closeSpan.className = 'arg-close';
            closeSpan.innerHTML = '&times;';
            header.appendChild(title);
            header.appendChild(closeSpan);
            container.appendChild(header);
            
            if (type === 'register') {
                // 注册表单
                const fields = [
                    { label: '用户名', id: 'arg_reg_username', type: 'text', placeholder: '请输入用户名' },
                    { label: '密码', id: 'arg_reg_password', type: 'password', placeholder: '输入密码' },
                    { label: '确认密码', id: 'arg_reg_confirm', type: 'password', placeholder: '再次输入密码' },
                    { label: '内推码', id: 'arg_reg_invite', type: 'text', placeholder: '请输入内推码' }
                ];
                fields.forEach(f => {
                    const group = document.createElement('div');
                    group.className = 'arg-form-group';
                    const label = document.createElement('label');
                    label.textContent = f.label;
                    const input = document.createElement('input');
                    input.type = f.type;
                    input.id = f.id;
                    input.placeholder = f.placeholder;
                    group.appendChild(label);
                    group.appendChild(input);
                    container.appendChild(group);
                });
                const btnDiv = document.createElement('div');
                btnDiv.className = 'arg-buttons';
                const submitBtn = document.createElement('button');
                submitBtn.textContent = '注册';
                submitBtn.className = 'arg-btn-primary';
                const cancelBtn = document.createElement('button');
                cancelBtn.textContent = '取消';
                cancelBtn.className = 'arg-btn-secondary';
                btnDiv.appendChild(submitBtn);
                btnDiv.appendChild(cancelBtn);
                container.appendChild(btnDiv);
                
                submitBtn.addEventListener('click', () => handleRegisterSubmit());
                cancelBtn.addEventListener('click', () => closeModal(overlay));
           } else {
                // 登录表单
                const userGroup = document.createElement('div');
                userGroup.className = 'arg-form-group';
                const userLabel = document.createElement('label');
                userLabel.textContent = '用户名';
                const userInput = document.createElement('input');
                userInput.type = 'text';
                userInput.id = 'arg_login_username';
                userInput.placeholder = '你的注册名';
                userGroup.appendChild(userLabel);
                userGroup.appendChild(userInput);
                container.appendChild(userGroup);
                
                const pwdGroup = document.createElement('div');
                pwdGroup.className = 'arg-form-group';
                const pwdLabel = document.createElement('label');
                pwdLabel.textContent = '密码';
                const pwdInput = document.createElement('input');
                pwdInput.type = 'password';
                pwdInput.id = 'arg_login_password';
                pwdInput.placeholder = '密码';
                pwdGroup.appendChild(pwdLabel);
                pwdGroup.appendChild(pwdInput);
                container.appendChild(pwdGroup);
                
                // 新增：忘记密码按钮区域
                const forgotDiv = document.createElement('div');
                forgotDiv.style.textAlign = 'right';
                forgotDiv.style.marginTop = '-8px';
                forgotDiv.style.marginBottom = '12px';
                const forgotLink = document.createElement('a');
                forgotLink.href = 'javascript:void(0)';
                forgotLink.textContent = '忘记密码？';
                forgotLink.style.fontSize = '0.8rem';
                forgotLink.style.color = '#ff8c00';
                forgotLink.style.textDecoration = 'none';
                forgotLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    handleForgotPassword();
                });
                forgotDiv.appendChild(forgotLink);
                container.appendChild(forgotDiv);
                
                const btnDiv = document.createElement('div');
                btnDiv.className = 'arg-buttons';
                const loginBtn = document.createElement('button');
                loginBtn.textContent = '登陆';
                loginBtn.className = 'arg-btn-primary';
                const cancelBtn = document.createElement('button');
                cancelBtn.textContent = '取消';
                cancelBtn.className = 'arg-btn-secondary';
                btnDiv.appendChild(loginBtn);
                btnDiv.appendChild(cancelBtn);
                container.appendChild(btnDiv);
                
                loginBtn.addEventListener('click', () => handleLoginSubmit());
                cancelBtn.addEventListener('click', () => closeModal(overlay));
            }
            
            // 点击遮罩关闭
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeModal(overlay);
            });
            closeSpan.addEventListener('click', () => closeModal(overlay));
            document.body.appendChild(overlay);
            return overlay;
        }
        
        function closeModal(modalEl) {
            if (modalEl) modalEl.classList.remove('active');
        }
        
        function showModal(type) {
            let modal = document.getElementById(`arg-${type}-modal`);
            if (!modal) {
                modal = createModal(type);
            }
            // 每次打开前重置表单内容
            if (type === 'register') {
                const uname = document.getElementById('arg_reg_username');
                const pwd = document.getElementById('arg_reg_password');
                const confirm = document.getElementById('arg_reg_confirm');
                const invite = document.getElementById('arg_reg_invite');
                if (uname) uname.value = '';
                if (pwd) pwd.value = '';
                if (confirm) confirm.value = '';
                if (invite) invite.value = '';
            } else {
                const uname = document.getElementById('arg_login_username');
                const pwd = document.getElementById('arg_login_password');
                if (uname) uname.value = '';
                if (pwd) pwd.value = '';
            }
            modal.classList.add('active');
        }
        
        // ----- 单用户存储逻辑 (localStorage) -----
        const STORED_USER_KEY = 'arg_single_user';
        
        function getStoredUser() {
            const raw = localStorage.getItem(STORED_USER_KEY);
            if (raw) {
                try {
                    return JSON.parse(raw);
                } catch(e) { return null; }
            }
            return null;
        }
        
        function saveUser(username, password) {
            localStorage.setItem(STORED_USER_KEY, JSON.stringify({ username, password }));
        }
        
         // 注册提交逻辑 (单用户体验，已注册时可选择覆盖)
        function handleRegisterSubmit() {
            const username = document.getElementById('arg_reg_username').value.trim();
            const password = document.getElementById('arg_reg_password').value;
            const confirmPwd = document.getElementById('arg_reg_confirm').value;
            const inviteCode = document.getElementById('arg_reg_invite').value.trim();
            
            // 1. 非空校验
            if (!username) { alert('❌ 用户名不能为空'); return; }
            if (!password) { alert('❌ 密码不能为空'); return; }
            if (!confirmPwd) { alert('❌ 请确认密码'); return; }
            if (!inviteCode) { alert('❌ 内推码不能为空'); return; }
            
            // 2. 密码一致性
            if (password !== confirmPwd) { alert('⚠️ 两次输入的密码不一致'); return; }
            
            // 3. 内推码必须为 womenjiehunba
            if (inviteCode !== 'womenjiehunba') { alert('❌ 内推码错误'); return; }
            
             // 4. 检查是否已有用户（单用户覆盖逻辑）
            const existing = getStoredUser();
            if (existing !== null) {
                // 询问是否覆盖旧档案
                const confirmOverwrite = confirm(`⚠️ 检测到本地已有账号「${existing.username}」。\n仍要注册新账号吗？（旧账号将被清除）`);
                if (!confirmOverwrite) {
                    // 取消覆盖：关闭注册弹窗
                    const regModal = document.getElementById('arg-register-modal');
                    if (regModal) closeModal(regModal);
                    return;
                }
                // 用户确认覆盖：清除旧数据
                localStorage.removeItem(STORED_USER_KEY);
            }
            
            // 注册成功，保存用户信息
            saveUser(username, password);
            alert(`✨ 注册成功！\n欢迎你，「${username}」\赶快「登陆」吧。`);
            const regModal = document.getElementById('arg-register-modal');
            if (regModal) closeModal(regModal);
        }
        
        // 登录提交逻辑 (匹配保存的唯一用户)
        function handleLoginSubmit() {
            const username = document.getElementById('arg_login_username').value.trim();
            const password = document.getElementById('arg_login_password').value;
            
            if (!username || !password) {
                alert('❌ 用户名和密码都不能为空');
                return;
            }
            
            const storedUser = getStoredUser();
            if (!storedUser) {
                alert('❌ 尚未注册任何身份。请先点击「注册」创建你的账号。');
                const loginModal = document.getElementById('arg-login-modal');
                if (loginModal) closeModal(loginModal);
                return;
            }
            
            if (storedUser.username === username && storedUser.password === password) {
                alert(`✅ 登陆成功！\n欢迎回来，${username}\n`);
                const loginModal = document.getElementById('arg-login-modal');
                if (loginModal) closeModal(loginModal);
            } else {
                alert('❌ 用户名或密码错误，无法进入。请检查你的身份凭证。');
            }
        }
        
        // ----- 重写原有的 handleLogin 和 handleRegister 函数（全局暴露）-----
        window.handleLogin = function() {
            showModal('login');
        };
        
        window.handleRegister = function() {
            showModal('register');
        };

        // 额外清理一下可能残留的手动调用（保证原有onclick可以正常弹出）
    })();

        // 显示登陆提示
        function showLoginPrompt(event) {
            event.preventDefault();
            alert('🔒 请登录后查看');
        }

        // 历史浏览按钮处理
        function handleHistory() {
            alert('📜 历史浏览功能开发中...\n将用于储存你打开过的网页信息');
        }

        // 搜索功能处理
        document.querySelector('.search-btn').addEventListener('click', function() {
            const searchType = document.getElementById('searchType').value;
            const searchText = document.querySelector('.search-input').value;
            if (searchText.trim()) {
                const typeLabel = searchType === 'search' ? '搜索' : '地道搜索';
                alert(`🔍 ${typeLabel}：${searchText}\n\n搜索功能开发中...`);
            } else {
                alert('请输入搜索内容');
            }
        });

        // 回车搜索
        document.querySelector('.search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('.search-btn').click();
            }
        });
    </script>
</body>
</html>
