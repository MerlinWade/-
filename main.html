<!DOCTYPE html>
<html lang="zh-CN">
    </style>
   <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快888快捷导航</title>
    <style>
        /* 宁源模式：全局黑白滤镜，天气栏特殊样式 */
        .ningyuan-mode {
            filter: grayscale(1);
        }
        /* 确保天气栏在黑白模式下显示红色文字（覆盖滤镜影响） */
        .ningyuan-mode .weather-info {
            filter: grayscale(0);
            color: #ff0000 !important;
            background: #000 !important;
            border-color: #ff0000 !important;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 修改背景为灰色，并添加挽联 */
        body {
            font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
            background: #3a3f44;  /* 深灰色背景 */
            min-height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 挽联：左右两侧白色楷体 */
       /* 基础样式（电脑端，原样保留或稍作调整） */
body::before,
body::after {
    content: "死生有命  富贵在天";
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    font-family: "楷体", "华文楷书", "Microsoft YaHei", serif;
    font-size: 24px;
    color: white;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 8px;
    font-weight: bold;
    opacity: 0.8;
    z-index: 1;
    pointer-events: none;
    white-space: nowrap;
}
body::before {
    left: 10px;
}
body::after {
    right: 10px;
}

/* 移动端适配：可见，但缩小字号并调整位置 */
@media (max-width: 768px) {
    body::before,
    body::after {
        font-size: 14px;          /* 缩小字号 */
        letter-spacing: 4px;      /* 减小字间距 */
        opacity: 0.6;             /* 稍微透明，减少遮挡感 */
    }
    body::before {
        left: 2px;                /* 更靠近边缘 */
    }
    body::after {
        right: 2px;
    }
}

        /* 顶部导航栏 */
        .navbar {
            background: linear-gradient(to bottom, #f5f5f5, #e8e8e8);
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 12px 15px;
            margin-bottom: 25px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }
    <style>
        /* 以下为原有完整样式，为节省篇幅省略，实际代码中应完整保留 */
        /* ... 原有所有样式 ... */

    </style>
</head>
<body>
    <!-- 顶部导航栏（未改动） -->
    <div class="navbar">
        <div class="navbar-brand">🌐 快888快捷导航</div>
        <div class="weather-info">📍 北淀市 -18℃ 雨</div>
        <div class="navbar-search">
            <select class="search-select" id="searchType">
                <option value="search">搜索</option>
                <option value="daodelao">地道搜索</option>
            </select>
            <input type="text" class="search-input" placeholder="搜索网站、新闻、资讯...">
            <button class="search-btn">搜索</button>
        </div>
        <div class="navbar-right">
            <button class="login-btn" onclick="handleLogin()">登陆</button>
            <button class="register-btn" onclick="handleRegister()">注册</button>
        </div>
    </div>

    <!-- 主容器等其他 HTML 结构不变（省略） -->
    <!-- ... 原有 body 内容 ... -->

    <script>
        // ========== 单用户注册/登录模态框（淡蓝 + 彩蛋 + 宁源特殊登录）==========
        (function() {
            // 全局状态
            let currentUser = null;
            const ADMIN_USERNAME = '宁源';
            const ADMIN_PASSWORD = '20180417';

            // 注入模态框样式（保持不变）
            const modalStyle = document.createElement('style');
            modalStyle.textContent = `/* ... 原有模态框样式 ... */`;
            document.head.appendChild(modalStyle);

            // 宁源主题样式（不变）
            const themeStyle = document.createElement('style');
            themeStyle.textContent = `
                .ningyuan-mode {
                    filter: grayscale(1);
                }
                .ningyuan-mode .weather-info {
                    filter: grayscale(0);
                    color: #ff0000 !important;
                    background: #000 !important;
                    border-color: #ff0000 !important;
                }
            `;
            document.head.appendChild(themeStyle);

            // 音频相关函数（保持不变）
            let audioCtx = null;
            function playWarningSound() { /* 原有代码 */ }

            // 黑屏 + 乱码特效（保持不变）
            function blackout(durationMs = 1500) { /* 原有代码 */ }

            function showWarning(message, duration = 3000) { /* 原有代码 */ }

            // 存储逻辑（保持不变）
            const STORAGE_KEY = 'arg_single_user';
            function getStoredUser() { /* 原有代码 */ }
            function saveUser(username, password) { /* 原有代码 */ }
            function clearUser() { /* 原有代码 */ }

            // 应用宁源主题（保持不变）
            function applyNingyuanTheme() {
                document.body.classList.add('ningyuan-mode');
                const weatherDiv = document.querySelector('.weather-info');
                if (weatherDiv) {
                    weatherDiv.textContent = '📍 ？？？ -8层';
                    weatherDiv.style.color = '#ff0000';
                }
            }

            // 恢复默认主题（保持不变）
            function restoreDefaultTheme() {
                document.body.classList.remove('ningyuan-mode');
                const weatherDiv = document.querySelector('.weather-info');
                if (weatherDiv) {
                    weatherDiv.textContent = '📍 北淀市 -18℃ 雨';
                    weatherDiv.style.color = '';
                    weatherDiv.style.backgroundColor = '#fff3cd';
                }
            }

            // 增强红色闪烁效果（延长保持时间，确保可见）
            function redFlash() {
                const flashOverlay = document.createElement('div');
                flashOverlay.style.position = 'fixed';
                flashOverlay.style.top = '0';
                flashOverlay.style.left = '0';
                flashOverlay.style.width = '100%';
                flashOverlay.style.height = '100%';
                flashOverlay.style.backgroundColor = 'rgba(255, 0, 0, 0.8)';
                flashOverlay.style.zIndex = '99999';
                flashOverlay.style.pointerEvents = 'none';
                flashOverlay.style.transition = 'opacity 0.3s';
                flashOverlay.style.opacity = '1';
                document.body.appendChild(flashOverlay);
                
                // 保持红色 0.2 秒，然后淡出 0.1 秒
                setTimeout(() => {
                    flashOverlay.style.opacity = '0';
                    setTimeout(() => {
                        flashOverlay.remove();
                    }, 100);
                }, 200);
            }

            // 更新顶部导航栏（保持不变）
            function updateNavButtons() { /* 原有代码 */ }

            // 登出函数（保持不变）
            function logout() {
                if (currentUser === ADMIN_USERNAME) {
                    restoreDefaultTheme();
                }
                currentUser = null;
                updateNavButtons();
                alert('已安全登出');
            }

            // 显示大量红色"再见"（增加回调参数，用于全部特效完成后执行）
            function showRedGoodbye(onComplete) {
                const container = document.createElement('div');
                container.style.position = 'fixed';
                container.style.top = '0';
                container.style.left = '0';
                container.style.width = '100%';
                container.style.height = '100%';
                container.style.zIndex = '40000';
                container.style.pointerEvents = 'none';
                container.style.overflow = 'hidden';
                document.body.appendChild(container);
                
                const wordCount = 200;
                const words = [];
                for (let i = 0; i < wordCount; i++) {
                    const span = document.createElement('span');
                    span.textContent = '再见';
                    span.style.position = 'absolute';
                    span.style.color = '#ff0000';
                    const fontSize = Math.floor(Math.random() * 80 + 20);
                    span.style.fontSize = fontSize + 'px';
                    span.style.fontWeight = 'bold';
                    span.style.fontFamily = 'monospace';
                    span.style.whiteSpace = 'nowrap';
                    span.style.opacity = '0';
                    span.style.transition = 'opacity 0.05s linear';
                    span.style.left = Math.random() * 100 + '%';
                    span.style.top = Math.random() * 100 + '%';
                    span.style.transform = `rotate(${Math.random() * 30 - 15}deg)`;
                    container.appendChild(span);
                    words.push(span);
                }
                
                const delays = words.map(() => Math.random() * 800);
                let completedCount = 0;
                const soundInterval = 25;
                const soundOffset = 0;
                
                words.forEach((word, idx) => {
                    setTimeout(() => {
                        word.style.opacity = '1';
                        if ((idx - soundOffset) % soundInterval === 0) {
                            playWarningSound();
                        }
                        completedCount++;
                        if (completedCount === wordCount) {
                            redFlash();  // 全部出现后红色闪烁
                            // 闪烁结束后（约 0.7秒后）执行回调
                            setTimeout(() => {
                                if (onComplete) onComplete();
                            }, 700);
                        }
                    }, delays[idx]);
                });
                
                // 最后清理（1.5秒后移除所有文字）
                setTimeout(() => {
                    words.forEach(word => {
                        word.style.transition = 'opacity 0.3s';
                        word.style.opacity = '0';
                    });
                    setTimeout(() => {
                        container.remove();
                    }, 400);
                }, 1500);
            }

            // 注销账号（修改宁源分支：在红色闪烁结束后恢复主题）
            function deleteAccount() {
                const isAdmin = (currentUser === ADMIN_USERNAME);
                if (isAdmin) {
                    playWarningSound();
                    showWarning('没关系，下次再见~', 1800);
                    // 延迟 2.8 秒后开始出现“再见”特效
                    setTimeout(() => {
                        showRedGoodbye(() => {
                            // 所有特效（包括红色闪烁）完成后，再恢复主题和清空状态
                            restoreDefaultTheme();
                            currentUser = null;
                            updateNavButtons();
                        });
                    }, 2800);
                    return;
                }
                // 普通用户注销
                const stored = getStoredUser();
                if (stored && stored.username === currentUser) {
                    clearUser();
                    alert(`账号「${currentUser}」已注销，账号已清除。\n感谢您的使用！`);
                }
                currentUser = null;
                updateNavButtons();
            }

            // 忘记密码（保持不变）
            function forgotPassword() { /* 原有代码 */ }

            // 模态框管理（保持不变）
            let currentModal = null;
            function closeModal() { /* 原有代码 */ }

            // 注册模态框（保持不变）
            function showRegisterModal() { /* 原有代码 */ }

            // 登录模态框（修复普通用户登录验证）
            function showLoginModal() {
                closeModal();
                const overlay = document.createElement('div');
                overlay.className = 'arg-overlay';
                overlay.innerHTML = `
                    <div class="arg-modal">
                        <span class="arg-close">&times;</span>
                        <h3>🔐 登录</h3>
                        <div class="arg-group"><label>用户名</label><input type="text" id="login_user" placeholder="你的注册名"></div>
                        <div class="arg-group"><label>密码</label><input type="password" id="login_pwd" placeholder="密码"></div>
                        <div class="forgot-link"><a id="forgot_btn">忘记密码？</a></div>
                        <div class="arg-buttons"><button class="arg-btn-primary" id="login_submit">登陆</button><button class="arg-btn-secondary" id="login_cancel">取消</button></div>
                    </div>
                `;
                document.body.appendChild(overlay);
                currentModal = overlay;

                overlay.querySelector('.arg-close').onclick = closeModal;
                overlay.querySelector('#login_cancel').onclick = closeModal;
                overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
                overlay.querySelector('#forgot_btn').onclick = (e) => { e.preventDefault(); forgotPassword(); };

                const loginBtn = overlay.querySelector('#login_submit');
                loginBtn.onclick = () => {
                    const username = overlay.querySelector('#login_user').value.trim();
                    const password = overlay.querySelector('#login_pwd').value;
                    if (!username || !password) {
                        alert('❌ 用户名和密码都不能为空');
                        return;
                    }
                    let loginSuccess = false;
                    // 宁源特殊登录
                    if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                        loginSuccess = true;
                        currentUser = ADMIN_USERNAME;
                        redFlash();
                        applyNingyuanTheme();
                    } else {
                        // 普通用户验证（修复缺失的代码）
                        const stored = getStoredUser();
                        if (stored && stored.username === username && stored.password === password) {
                            loginSuccess = true;
                            currentUser = username;
                        }
                    }
                    if (loginSuccess) {
                        alert(`✅ 登陆成功！欢迎回来，${username}`);
                        closeModal();
                        updateNavButtons();
                    } else {
                        alert('❌ 用户名或密码错误');
                    }
                };
                overlay.classList.add('active');
            }

            // 暴露全局函数
            window.handleLogin = showLoginModal;
            window.handleRegister = showRegisterModal;

            // 页面加载完成后初始化导航栏按钮状态
            window.addEventListener('DOMContentLoaded', function() {
                updateNavButtons();
            });
        })();

        // 显示登录提示（保持不变）
        function showLoginPrompt(event) {
            event.preventDefault();
            alert('🔒 请登录后查看');
        }

        // 搜索功能处理（保持不变）
        document.querySelector('.search-btn').addEventListener('click', function() {
            const searchType = document.getElementById('searchType').value;
            const searchText = document.querySelector('.search-input').value;
            if (searchText.trim()) {
                const typeLabel = searchType === 'search' ? '搜索' : '地道搜索';
                alert(`🔍 ${typeLabel}：${searchText}\n\n搜索功能开发中...`);
            } else {
                alert('请输入搜索内容');
            }
        });

        // 回车搜索
        document.querySelector('.search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.querySelector('.search-btn').click();
            }
        });
    </script>
</body>
